name: build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish release <yyyymmdd-hhmm> UTC. Off = dry run, artifact only, 7 days."
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  JOBS: 4

jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2

      - name: versions
        run: bun scripts/common.ts >> "$GITHUB_ENV"

      - name: cache emsdk + stage1
        uses: actions/cache@v4
        with:
          path: |
            emsdk
            /home/runner/llvm-build/stage1
          key: ${{ env.LLVM_VER }}-${{ env.EMSDK_VER }}-${{ env.WASI_SDK_VER }}-${{ hashFiles('scripts/setup.ts') }}

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          max-size: 4G

      - name: restore ThinLTO cache
        id: lto
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/llvm-build/lto.cache
          key: lto-${{ env.LLVM_VER }}-${{ env.EMSDK_VER }}-${{ github.sha }}
          restore-keys: lto-${{ env.LLVM_VER }}-${{ env.EMSDK_VER }}-

      - name: install deps
        run: |
          bun install --frozen-lockfile
          bunx --bun playwright install --with-deps chromium

      - name: typecheck
        run: bunx --bun tsc --noEmit

      - name: setup
        run: bun scripts/setup.ts

      - name: build clangd
        run: bun scripts/build-clangd.ts

      - name: build llvm multicall
        run: bun scripts/build-clang.ts

      - name: save ThinLTO cache
        if: always() && steps.lto.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/llvm-build/lto.cache
          key: lto-${{ env.LLVM_VER }}-${{ env.EMSDK_VER }}-${{ github.sha }}

      - name: "PCHs, gate: compile + link + run, tty"
        run: |
          bun scripts/gen-pch.ts ./dist
          ls -la dist/pch/

      - name: "gate: clangd LSP"
        run: bun test/clangd.ts ./dist

      - name: stage release
        run: |
          mkdir -p release
          for t in clangd-jspi clangd-asyncify llvm; do
            cp dist/$t.js dist/$t.d.ts dist/$t.wasm release/
          done
          cp dist/include.tar dist/lib.tar dist/pch/*.pch release/
          printf '{"llvm":"%s","emscripten":"%s","wasiSdk":"%s"}' \
            "$LLVM_VER" "$EMSDK_VER" "$WASI_SDK_VER" > release/versions.json
          ls -la release/

      - name: upload dry run
        if: '!inputs.release'
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-dryrun-${{ github.sha }}
          path: release/
          retention-days: 7

      - name: release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOW=$(date -u +%s)
          TAG=$(date -u -d "@$NOW" +%Y%m%d-%H%M)
          NOTES=$(printf 'WASM: v%s\nLLVM: v%s\nWASI: v%s\n%s\n' \
            "$EMSDK_VER" "$LLVM_VER" "$WASI_SDK_VER" "$(date -u -d "@$NOW" +%FT%TZ)")
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "${GITHUB_SHA::7}" \
            --notes "$NOTES" \
          || gh release upload "$TAG" release/* --clobber

