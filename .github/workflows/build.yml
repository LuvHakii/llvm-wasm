name: build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish both verified toolchains in one release. Off = artifacts only, 7 days."
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  JOBS: 4

jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2

      - name: versions
        run: bun scripts/common.ts >> "$GITHUB_ENV"

      - name: cache emsdk + stage1
        uses: actions/cache@v4
        with:
          path: |
            emsdk
            /home/runner/llvm-build/stage1
          key: ${{ env.LLVM_VER }}-${{ env.EMSDK_VER }}-${{ env.WASI_SDK_VER }}-${{ hashFiles('scripts/setup.ts') }}

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: toolchain
          max-size: 4G

      - name: restore ThinLTO cache
        id: lto
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/llvm-build/lto.cache
          key: lto-${{ env.LLVM_VER }}-${{ env.EMSDK_VER }}-${{ github.sha }}
          restore-keys: lto-${{ env.LLVM_VER }}-${{ env.EMSDK_VER }}-

      - name: install deps
        run: |
          bun install --frozen-lockfile
          bun test test/common.test.ts
          bunx --bun playwright install --with-deps chromium

      - name: typecheck
        run: bun check

      - name: setup
        run: bun scripts/setup.ts

      - name: build clangd
        run: bun scripts/build-clangd.ts

      - name: build llvm multicall
        run: bun scripts/build-clang.ts

      - name: save ThinLTO cache
        if: always() && steps.lto.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/llvm-build/lto.cache
          key: lto-${{ env.LLVM_VER }}-${{ env.EMSDK_VER }}-${{ github.sha }}

      - name: "gate: compile + link + run, tty"
        run: bun scripts/gate.ts ./dist

      - name: "gate: clangd LSP"
        run: bun test/clangd.ts ./dist

      - name: stage release
        run: |
          mkdir -p release
          for t in clangd-jspi clangd-asyncify llvm; do
            cp dist/$t.js dist/$t.d.ts dist/$t.wasm release/
          done
          cp dist/include.tar dist/lib.tar release/
          printf '{"llvm":"%s","emscripten":"%s","wasiSdk":"%s"}' \
            "$LLVM_VER" "$EMSDK_VER" "$WASI_SDK_VER" > release/versions.json
          ls -la release/

      - name: upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  assembly:
    uses: ./.github/workflows/build-x86-asm.yml

  release:
    needs: [toolchain, assembly]
    if: inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: toolchain-${{ github.sha }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: x86-asm-${{ github.sha }}
          path: release
      - name: publish both toolchains
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOW=$(date -u +%s)
          TAG=$(date -u -d "@$NOW" +%Y%m%d-%H%M)
          test "$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" --jq length)" = 0
          NOTES=$(printf 'Emscripten: %s\nLLVM: %s\nWASI: %s\nBuild: %s\n%s\n' \
            "$(jq -r .emscripten release/versions.json)" \
            "$(jq -r .llvm release/versions.json)" \
            "$(jq -r .wasiSdk release/versions.json)" \
            "$GITHUB_SHA" "$(date -u -d "@$NOW" +%FT%TZ)")
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" --title "${GITHUB_SHA::7}" --notes "$NOTES"
