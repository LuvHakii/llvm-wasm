name: build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish release <yyyymmdd-hhmm> UTC. Off = dry run, artifact only, 7 days."
        type: boolean
        default: false

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write

env:
  ROOT: /home/runner/llvm-build
  JOBS: 4

jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4

      # node is here for the tsc shebang that emcc --emit-tsd shells out to;
      # emsdk keeps its own node but never puts it on PATH.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: cache sources + emsdk + stage1
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/llvm-build/llvm-project
            /home/runner/llvm-build/emsdk
            /home/runner/llvm-build/stage1
          key: toolchain-${{ hashFiles('scripts/common.sh', 'scripts/setup.sh') }}

      # tsc for emcc --emit-tsd, Playwright for the gates, wasi shim for link.html
      - name: install deps
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          mkdir -p dist/wasi
          cp node_modules/@bjorn3/browser_wasi_shim/dist/*.js dist/wasi/

      # Seconds, and before the five-hour build rather than after it.
      - name: typecheck
        run: bunx tsc --noEmit

      - name: setup
        run: bash scripts/setup.sh

      - name: build clangd
        run: bash scripts/build-clangd.sh

      - name: build llvm multicall
        run: bash scripts/build-clang.sh

      - name: "gate: compile + link + run"
        run: bun scripts/browser-test/run.ts ./dist /compile.html,/link.html

      - name: "gate: clangd LSP"
        run: bun scripts/browser-test/run.ts ./dist /

      # clang has no pthread pool, so this one needs no browser
      - name: generate PCHs
        run: |
          bun scripts/gen-pch.ts ./dist
          ls -la dist/pch/

      - name: stage release
        run: |
          source scripts/common.sh
          mkdir -p release
          for t in clangd llvm; do
            cp dist/$t.js dist/$t.d.ts release/
            gzip -9 -c dist/$t.wasm > release/$t.wasm.gz
          done
          for f in dist/pch/*.pch; do
            gzip -9 -c "$f" > "release/$(basename "$f").gz"
          done
          printf '{"llvm":"%s","emscripten":"%s","wasiSdk":"%s"}' \
            "$LLVM_VER" "$EMSDK_VER" "$WASI_SDK_VER" > release/versions.json
          ls -la release/

      - name: upload dry run
        if: '!inputs.release'
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-dryrun-${{ github.sha }}
          path: release/
          retention-days: 7

      - name: release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/common.sh
          # One clock read, so tag and body can never straddle a minute.
          NOW=$(date -u +%s)
          TAG=$(date -u -d "@$NOW" +%Y%m%d-%H%M)
          NOTES=$(printf 'WASM: v%s\nLLVM: v%s\nWASI: v%s\n%s\n' \
            "$EMSDK_VER" "$LLVM_VER" "$WASI_SDK_VER" "$(date -u -d "@$NOW" +%FT%TZ)")
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "${GITHUB_SHA::7}" \
            --notes "$NOTES" \
          || gh release upload "$TAG" release/* --clobber

