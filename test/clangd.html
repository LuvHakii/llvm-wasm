<!doctype html>
<html>
<head><meta charset="utf-8"><title>clangd test</title></head>
<body>
<pre id="log">starting</pre>
<script type="module">
const log = o => { document.getElementById('log').textContent += '\n' + JSON.stringify(o); console.log(o); };
window.__done = null;
window.__result = null;

const WORKSPACE = '/src';
const FILE = `${WORKSPACE}/main.cpp`;
const SOURCE = `#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n  vector<int> v{3,1,2};\n  v.\n  return 0;\n}\n`;

const queue = [];
let wake = null;
const inbox = [];

function send(o) {
	const json = JSON.stringify(o);
	if (wake) { wake(json); wake = null; } else queue.push(json);
}
const waitFor = async (pred, label, ms = 60000) => {
	const dl = performance.now() + ms;
	for (;;) {
		const hit = inbox.find(pred);
		if (hit) return hit;
		if (performance.now() > dl) throw new Error('timeout: ' + label);
		await new Promise(r => setTimeout(r, 25));
	}
};

try {
	log({crossOriginIsolated: self.crossOriginIsolated});
	const t0 = performance.now();
	const {default: Clangd} = await import(`./clangd-${new URLSearchParams(location.search).get('v')}.js`);
	const {parseTar} = await import('/node_modules/nanotar/dist/index.mjs');
	const sysroot = parseTar(await (await fetch('./include.tar')).arrayBuffer());
	let errLine = '';
	const clangd = await Clangd({
		thisProgram: '/usr/bin/clangd',
		nextMessage: () => queue.length ? queue.shift() : new Promise(r => (wake = r)),
		onMessage: json => inbox.push(JSON.parse(json)),
		stderr: c => { errLine += String.fromCharCode(c); if (c === 10) { log({stderr: errLine.trim()}); errLine = ''; } },
		onExit: code => log({exit: code}),
		onAbort: reason => log({abort: reason})
	});
	const tInst = performance.now() - t0;
	log({tInst});

	for (const {name, type, data} of sysroot) {
		if (type === 'directory') clangd.FS.mkdirTree(`/${name}`);
		else if (type === 'file') clangd.FS.createDataFile(`/${name}`, null, data ?? new Uint8Array(0), true, false, true);
	}
	clangd.FS.mkdir(WORKSPACE);
	clangd.FS.writeFile(FILE, SOURCE);
	let pch = null;
	try {
		const r = await fetch('./pch/stdc++-c++20.pch');
		if (!r.ok) throw new Error('pch ' + r.status);
		pch = new Uint8Array(await r.arrayBuffer());
		clangd.FS.createDataFile('/stdc++.pch', null, pch, true, false, true);
		log({pch: pch.length});
	} catch {
		log({pch: null});
	}
	clangd.FS.writeFile(`${WORKSPACE}/.clangd`, JSON.stringify({CompileFlags: {Add: [
		'--target=wasm32-wasip1', '-std=c++20', '-fwasm-exceptions',
		...(pch ? ['-include-pch', '/stdc++.pch', '-Xclang', '-fno-validate-pch'] : [])
	]}}));
	clangd.callMain(['--background-index=false']);

	const t1 = performance.now();
	send({jsonrpc:'2.0', id:1, method:'initialize', params:{processId:null, rootUri:`file://${WORKSPACE}`, capabilities:{}}});
	await waitFor(m => m.id === 1, 'initialize');
	const tInit = performance.now() - t1;
	log({tInit});
	send({jsonrpc:'2.0', method:'initialized', params:{}});
	send({jsonrpc:'2.0', method:'textDocument/didOpen', params:{textDocument:{uri:`file://${FILE}`, languageId:'cpp', version:1, text:SOURCE}}});

	const t2 = performance.now();
	const diag = await waitFor(m => m.method === 'textDocument/publishDiagnostics', 'diagnostics');
	const tDiag = performance.now() - t2;
	log({tDiag, diagnostics: diag.params.diagnostics.map(d => d.message)});

	let items = [], labels = [], ok = false, tComp = 0, attempts = 0;
	const deadline = performance.now() + 180000;
	while (performance.now() < deadline) {
		attempts++;
		const id = 100 + attempts;
		const t3 = performance.now();
		send({jsonrpc:'2.0', id, method:'textDocument/completion', params:{textDocument:{uri:`file://${FILE}`}, position:{line:4, character:4}}});
		const comp = await waitFor(m => m.id === id, 'completion');
		tComp = performance.now() - t3;
		items = comp.result?.items ?? comp.result ?? [];
		labels = items.map(i => i.label ?? '');
		ok = labels.some(l => /push_back|size|begin/.test(l));
		if (ok) break;
		await new Promise(r => setTimeout(r, 1500));
	}
	window.__result = {ok, tInst, tInit, tDiag, tComp, attempts, items: items.length, sample: labels.slice(0, 12)};
} catch (e) {
	window.__result = {ok: false, error: e?.message ?? String(e)};
}
window.__done = true;
</script>
</body>
</html>
